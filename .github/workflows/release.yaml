name: release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write # create the release
    actions: write # delete artifacts

jobs:
    release:
        name: build and publish release
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: checkout repository
              uses: actions/checkout@v5

            - name: setup node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - name: verify tag matches package.json version
              run: |
                  PKG_VERSION="v$(node -p "require('./package.json').version")"
                  if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
                      echo "tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
                      exit 1
                  fi

            - name: install dependencies
              run: npm ci

            - name: build and package
              run: npm run build

            - name: create github release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$GITHUB_REF_NAME" release/*.zip \
                      --title "$GITHUB_REF_NAME" \
                      --generate-notes

            - name: delete all artifacts in this repo
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
              run: |
                  ids=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
                          --jq '.artifacts[].id')
                  for id in $ids; do
                      echo "Deleting artifact $id"
                      gh api -X DELETE "repos/$REPO/actions/artifacts/$id"
                  done
